<style>
/* Layout: one column phone app; summary strip, big start/stop control, trip log grouped by month; sheets slide up from the bottom. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --ink: #15201b;
  --muted: #5b6a63;
  --line: #d6dedA;
  --accent: #0e6b50;
  --accent-ink: #ffffff;
  --run: #c2410c;
  --danger: #b42318;
  --soft: #e2ebe7;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #17201c; --ink: #e5ece8; --muted: #98a7a0; --line: #2a3632;
    --accent: #3cbf8e; --accent-ink: #06231a; --run: #f08a4b; --danger: #f2675c; --soft: #1f2b27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #17201c; --ink: #e5ece8; --muted: #98a7a0; --line: #2a3632;
  --accent: #3cbf8e; --accent-ink: #06231a; --run: #f08a4b; --danger: #f2675c; --soft: #1f2b27;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 2px; gap: 12px; }
header.top h1 { font: 700 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
header.top .sub { color: var(--muted); font-size: 14px; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; }

.summary { display: grid; grid-template-columns: auto 1fr 1fr; gap: 12px; align-items: center; }
.yearsw { display: flex; align-items: center; gap: 2px; font: 600 20px var(--font-display); }
.yearsw button { background: none; border: 0; width: 32px; height: 40px; font-size: 22px; color: var(--muted); }
.stat .lbl, .lbl { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .val { font: 600 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.warn { color: var(--danger); font-size: 13px; }

.control { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 14px; }
.big {
  width: 100%; min-height: 128px; border: 0; border-radius: 18px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  font: 700 30px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  transition: transform .08s ease;
}
.big:active { transform: scale(.98); }
.big:disabled { opacity: .7; }
.big.start { background: var(--accent); color: var(--accent-ink); }
.big.stop { background: var(--run); color: #fff; min-height: 96px; }
.big .ico { width: 44px; height: 44px; border-radius: 50%; border: 3px solid currentColor; display: grid; place-items: center; }
.big .ico svg { width: 18px; height: 18px; fill: currentColor; }
.odo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.odo { display: inline-flex; gap: 3px; }
.odo span { font: 500 18px/1 var(--font-mono); background: var(--ink); color: var(--surface); padding: 6px 5px; border-radius: 4px; min-width: 22px; text-align: center; }
.odo span.unit { background: none; color: var(--muted); font: 500 14px var(--font-body); padding: 6px 2px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }

.run-head { display: flex; align-items: center; gap: 10px; font: 600 22px var(--font-display); text-transform: uppercase; letter-spacing: .03em; color: var(--run); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--run); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .big { transition: none; } }
.run-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.run-grid .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.run-grid .full { grid-column: 1 / -1; min-width: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

.field { display: grid; gap: 4px; min-width: 0; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.field input, .field select { min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.field.err input { border-color: var(--danger); }
.field .msg { color: var(--danger); font-size: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2, .row3 { align-items: start; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 10px; min-height: 44px; font-weight: 600; }
.yearbar { grid-column: 1 / -1; background: none; border: 0; padding: 0; text-align: left; color: inherit; display: grid; gap: 6px; }
.yearbar .yl, .yrow .yh { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.yearbar .yl span:last-child { color: var(--accent); font-weight: 600; }
.ylist { display: grid; gap: 12px; }
.yrow { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.yrow .yh b { font: 600 20px var(--font-display); color: var(--ink); }
.yrow dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; align-items: center; }
.yrow dt { color: var(--muted); font-size: 14px; } .yrow dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.yrow dd small { color: var(--muted); }
.yrow .refund { width: 110px; text-align: right; }
.yrow .warn { margin: 0; }
.bkcard { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; margin: 0 0 14px; display: grid; gap: 10px; }
.bkcard b { display: block; } .bkcard span { color: var(--muted); font-size: 14px; }
.modesw { margin: 0 0 14px; grid-template-columns: 1fr 1fr; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.month h2 { font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; margin: 8px 2px 8px; }
.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.trip { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 14px; width: 100%; }
.trip:first-child { border-top: 0; }
.trip .d { font: 600 18px/1.1 var(--font-display); }
.trip .d small { display: block; font: 400 13px var(--font-body); color: var(--muted); }
.trip .r { min-width: 0; }
.trip .r b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip .r span { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip .r span.pill { display: inline-block; color: var(--muted); font-size: 11px; }
.trip .r span.pill.draft { color: #fff; }
.trip .k { text-align: right; font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.pill.draft { background: var(--run); color: #fff; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; color: var(--muted); text-align: center; }

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 48px; padding: 10px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 600px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-radius: 22px 22px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; overscroll-behavior: contain;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h3 { margin: 0; font: 700 22px var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.calc { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.calc .opt { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.map { height: 260px; border-radius: 14px; overflow: hidden; background: var(--soft); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.log { font-size: 13px; color: var(--muted); }
.log li { margin-bottom: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.confirm { background: var(--soft); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }

.odo-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.cam { width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.cam svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
.cam.has { border-color: var(--accent); background: var(--soft); }
.cam.has svg { stroke: var(--accent); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumb { display: grid; gap: 4px; background: none; border: 0; padding: 0; text-align: left; font-size: 12px; color: var(--muted); }
.thumb img { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.favs { display: grid; gap: 6px; }
.favrow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.fav { flex: 0 0 auto; max-width: 70%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 12px; display: grid; gap: 2px; }
.fav b, .fav small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav small { color: var(--muted); font-size: 13px; }
.fav[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.viewer { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.choice { display: grid; gap: 10px; }
.choice .btn { min-height: 64px; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.choice .btn svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.choice .link { justify-self: center; }
.updbar { position: fixed; left: 0; right: 0; top: 0; z-index: 85; background: var(--accent); color: var(--accent-ink); display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); font-weight: 600; }
.updbar button { background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.scanner { position: fixed; inset: 0; z-index: 95; background: #000; color: #fff; overflow: hidden; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; left: 8%; right: 8%; top: 39%; height: 11%; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.6); transition: border-color .2s; z-index: 1; }
.scan-frame.ok { border-color: #3cbf8e; }
.scan-top { position: absolute; z-index: 2; left: 0; right: 0; top: 0; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 0; display: grid; gap: 4px; text-align: center; }
.scan-top b { font: 700 24px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.scan-bottom { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.scan-read { text-align: center; font: 500 30px var(--font-mono); min-height: 40px; font-variant-numeric: tabular-nums; }
.scan-read.msg { font: 500 17px var(--font-body); }
.scan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scan-actions .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.3); }
.scan-actions .btn.primary { grid-column: 1 / -1; min-height: 58px; font-size: 19px; background: #3cbf8e; color: #06231a; border-color: #3cbf8e; }
.scan-actions .btn:disabled { opacity: .45; }
.vehbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.l17card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; text-align: left; width: 100%; }
.l17card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.l17card .top b { font: 700 18px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.l17card .top span { font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.bar { display: block; height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar.over i { background: var(--danger); }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.steps { display: grid; gap: 2px; font-size: 14px; color: var(--muted); }
.steps .ok { color: var(--accent); font-weight: 600; }
.next { font-size: 14px; font-weight: 600; }
.vrow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.vlist { display: grid; gap: 8px; }
.pick { display: grid; gap: 8px; }
.pick .btn { text-align: left; min-height: 56px; }
.pick .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
fieldset.box { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 12px; margin: 0; min-width: 0; }
fieldset.box legend { font: 600 13px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 6px; }
.check { display: flex; gap: 10px; align-items: center; }
.check input { width: 22px; height: 22px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 12px 16px; border-radius: 12px; z-index: 80; max-width: calc(100% - 32px); font-size: 15px; }
.busy { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.busy div { background: var(--surface); padding: 18px 22px; border-radius: 14px; font-weight: 600; }

.pv { position: fixed; inset: 0; z-index: 60; background: #6b6f6d; overflow: auto; -webkit-overflow-scrolling: touch; }
.pv-bar { position: sticky; top: 0; left: 0; z-index: 1; display: flex; gap: 8px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background: var(--surface); border-bottom: 1px solid var(--line, #ddd); }
.pv-bar h3 { margin: 0 auto 0 0; font-size: 17px; }
.pv-pages { padding: 12px 8px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; justify-items: center; }
.pv-pages.big { justify-items: start; }
.pv-page { display: block; width: 100%; height: auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.pv-pages.big .pv-page { width: 260%; max-width: none; }
.pv-wait { color: #fff; text-align: center; margin: 40px 16px; }
@media print { .pv { display: none !important; } }

#print { display: none; }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; font: 10pt/1.3 var(--font-body); color: #000; }
  #print table { width: 100%; border-collapse: collapse; }
  #print th, #print td { border: 1px solid #999; padding: 3px 4px; vertical-align: top; text-align: left; }
  #print td.n, #print th.n { text-align: right; font-variant-numeric: tabular-nums; }
  #print h1 { font-size: 16pt; margin: 0 0 4px; }
  @page { size: A4 landscape; margin: 12mm; }
}
@media (max-width: 380px) { .summary { grid-template-columns: 1fr 1fr; } .yearsw { grid-column: 1 / -1; } .row3 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Fahrtenbuch</h1>
      <div class="sub" id="vehicle"></div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="modeSw" hidden></div>
  <section class="summary" id="summary"></section>
  <section id="l17card" hidden></section>
  <section class="control" id="control"></section>
  <section id="bkcard" hidden></section>
  <section id="log"></section>
  <section class="tools">
    <button class="btn" id="exportBtn">Export &amp; PDF</button>
    <button class="btn" id="backupBtn">Sicherung</button>
  </section>
</div>
<div id="print"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

const BACKUP_DAYS = { month: 30, week: 7 };
function backupDue() {
  const every = BACKUP_DAYS[S.settings.backupRemind || 'month'];
  if (!every || S.active || !S.trips.length) return null;
  const now = Date.now(), last = S.settings.lastBackup || 0;
  if ((S.settings.backupSnooze || 0) > now) return null;
  const changed = S.trips.some(t => Math.max(t.updated || 0, t.end?.t || t.start.t) > last);
  if (!changed) return null;
  if (!last) { const first = Math.min(...S.trips.map(t => t.start.t)); return now - first > 3 * 864e5 || S.trips.length >= 5 ? { last: 0 } : null; }
  return now - last > every * 864e5 ? { last, days: Math.floor((now - last) / 864e5) } : null;
}
function renderBackup() {
  const el = $('#bkcard'), due = backupDue();
  if (!due) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="bkcard"><div><b>Zeit für eine Sicherung</b><span>${due.last ? `Letzte Sicherung vor ${due.days} Tagen.` : 'Du hast noch keine Sicherung.'} Deine Fahrten sind nur auf diesem iPhone gespeichert.</span></div>
    <div class="actions"><button class="btn primary small" id="bkNow">Jetzt sichern</button><button class="btn small" id="bkLater">Später</button></div></div>`;
  $('#bkNow').onclick = openBackup;

/* ---------- sheets, toast, busy ---------- */
let sheetOnClose = null;
function openSheet(html, mount) {

}
function closeSheet() { const f = sheetOnClose; sheetOnClose = null; $('#sheetRoot').innerHTML = ''; f && f(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let toastTimer;
function toast(msg) { clearTimeout(toastTimer); $('#toastRoot').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; toastTimer = setTimeout(() => $('#toastRoot').innerHTML = '', 4000); }

/* ---------- start / stop ---------- */
let runCam = null, formCam = null;
// How the KM-Stand is taken at start/end: ask | camera | manual | off
const odoMode = () => S.settings.odoMode || (S.settings.autoCam === false ? 'off' : 'ask');
// The camera may only open inside a tap, so every path calls pickPhoto directly in a click handler.
function askOdo(title) {
  return new Promise(res => {
    openSheet(`
      <div class="sheet-head"><h3>${esc(title)}</h3></div>
      <p class="hint" style="margin:0">Wie willst du den KM-Stand erfassen?</p>
      <div class="choice">

      sh.querySelector('#oc_cam').onclick = () => pick({ mode: 'camera', req: camRequest() });
      sh.querySelector('#oc_man').onclick = () => pick({ mode: 'manual' });

function focusInput(id) { const i = $('#' + id); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); i.select?.(); } }
function startTrip() {
  const mode = odoMode();
  const req = mode === 'camera' ? camRequest() : null;
  beginTrip();
  const handle = c => {
    if (c.mode === 'camera') { if (S.active) runCamRequest(c.req, runCam, 'r_odo'); }
    else if (c.mode === 'manual') focusInput('r_odo');
  };

}
function beginTrip() {
  const t0 = Date.now(), veh = curVehicle(), last = lastTrip(veh?.id), id = uid();
  navigator.storage?.persist?.().catch(() => {});
  S.active = {
    id, vehicleId: veh?.id || null, type: modeType(), purpose: '', odoStart: last?.odoEnd ?? null,
    start: { t: t0, lat: null, lng: null, acc: null, addr: '' }, track: [],
  };
  saveActive(); render(); startWatch();
  getPos(12000).then(pos => {
    const a = S.active; if (!a || a.id !== id) return;
    if (pos && a.start.lat == null) {
      a.start.lat = pos.lat; a.start.lng = pos.lng; a.start.acc = pos.acc;
      if (!a.track.length) a.track.push([pos.lat, pos.lng, Math.round(t0 / 1000)]);
      saveActive(); const el = $('#runStart'); if (el) el.textContent = 'Adresse wird gesucht…';

    } else if (!pos && a.start.lat == null) toast('Noch kein GPS-Signal. Die Fahrt läuft trotzdem, der Standort wird nachgeholt.');
  });
}
async function resolveStartAddr() {
  const a = S.active; if (!a || a.start.addr || a._resolving) return;
  a._resolving = true;
  const addr = await reverseGeocode(a.start);
  delete a._resolving;
  if (S.active === a && addr) { a.start.addr = addr; saveActive(); const el = $('#runStart'); if (el) el.textContent = addr; }
}
function stopTrip() {
  if (!S.active) return;
  const mode = odoMode();
  const choice = mode === 'camera' ? Promise.resolve({ mode, req: camRequest() })
    : mode === 'ask' ? askOdo('Fahrt beendet') : Promise.resolve({ mode });
  stopTripGps(choice);
}
async function stopTripGps(choice) {
  const a = S.active; if (!a) return;
  const endT = Date.now();
  $('#stopBtn').disabled = true; $('#stopLbl').textContent = 'Ziel wird gesucht…';
  let pos = await getPos(10000);
  stopWatch(); clearInterval(tick);
  const lp = a.track[a.track.length - 1];
  if (pos) { if (!lp || hav(lp, [pos.lat, pos.lng]) > 0.02) a.track.push([pos.lat, pos.lng, Math.round(endT / 1000)]); }
  else if (lp) pos = { lat: lp[0], lng: lp[1], acc: null };
  const end = { t: endT, lat: pos?.lat ?? null, lng: pos?.lng ?? null, acc: pos?.acc ?? null, addr: '' };
  const lookups = Promise.all([a.start.addr ? a.start.addr : reverseGeocode(a.start), reverseGeocode(end), routeKm(a.start, end)]);
  const c = await choice;
  const done = busy('Adresse und Strecke werden ermittelt…');
  const [sAddr, eAddr, rt] = await lookups;
  done();
  const st = trackStats(a.track);
  const gpsGood = a.track.length >= 5 && st.gapShare < 0.15;
  let km = gpsGood ? st.km : (rt ? rt.km : st.km);
  km = round1(km);
  const trip = {
    id: a.id, vehicleId: a.vehicleId || curVehicle()?.id || null, type: a.type, purpose: a.purpose || '', client: '', note: '',
    companion: companions()[0] || '', weather: '',
    start: { ...a.start, addr: sAddr || '' }, end: { ...end, addr: eAddr || '' },
    track: a.track, routeLine: rt ? rt.line : null,
    kmGps: round1(st.km), kmRoute: rt ? round1(rt.km) : null, kmSource: gpsGood ? 'GPS-Aufzeichnung' : (rt ? 'Routenberechnung' : 'GPS-Aufzeichnung (lückenhaft)'),
    km, odoStart: a.odoStart, odoEnd: a.odoStart != null ? Math.round(a.odoStart + km) : null,
    created: Date.now(), updated: Date.now(), changes: [], manual: false, draft: true,
    photos: { start: !!a.photoStart, end: false },
  };
  trip.light = tripLight(trip);
  await store.putTrip(trip);
  S.trips.push(trip); S.active = null; await saveActive();
  S.year = new Date(trip.start.t).getFullYear();
  render();
  openTripForm(trip, { isNew: true });
  if (c.mode === 'camera') runCamRequest(c.req, formCam, 'f_odoEnd');
  else if (c.mode === 'manual') focusInput('f_odoEnd');
}

const FIELDS = [['date', 'Datum'], ['tStart', 'Beginn'], ['tEnd', 'Ende'], ['from', 'Abfahrtsort'], ['to', 'Zielort'], ['vehicle', 'Fahrzeug'], ['type', 'Fahrtart'], ['purpose', 'Zweck'], ['client', 'Kunde/Ort'], ['companion', 'Begleitperson'], ['weather', 'Straßenzustand/Witterung'], ['light', 'Tageszeit'], ['odoStart', 'KM-Stand Beginn'], ['odoEnd', 'KM-Stand Ende'], ['km', 'Gefahrene km'], ['note', 'Notiz']];

function drawMap(el, t) {
  if (!window.L) { el.innerHTML = '<p class="hint" style="padding:12px">Karte nicht verfügbar (offline?).</p>'; return; }
  const css = getComputedStyle(document.documentElement);
  const map = L.map(el, { zoomControl: false, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const gps = t.track && t.track.length > 1 ? t.track.map(p => [p[0], p[1]]) : null;
  const layers = [];
  if (t.routeLine && t.routeLine.length > 1) layers.push(L.polyline(t.routeLine, { color: css.getPropertyValue('--muted').trim() || '#666', weight: 4, dashArray: '6 8', opacity: .8 }));
  if (gps) layers.push(L.polyline(gps, { color: css.getPropertyValue('--accent').trim() || '#0e6b50', weight: 5 }));
  const s = t.start, e = t.end;
  if (s?.lat != null) layers.push(L.circleMarker([s.lat, s.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#0e6b50', fillOpacity: 1 }).bindTooltip('Start'));
  if (e?.lat != null) layers.push(L.circleMarker([e.lat, e.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#c2410c', fillOpacity: 1 }).bindTooltip('Ziel'));
  const grp = L.featureGroup(layers).addTo(map);
  setTimeout(() => { map.invalidateSize(); try { map.fitBounds(grp.getBounds(), { padding: [24, 24] }); } catch { map.setView([47.6, 13.8], 7); } }, 50);
}

/* ---------- export ---------- */
function yearTrips(y, opts = {}) {

}
async function deliverFile(name, blob, onDone = () => {}) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); onDone(); return; } catch (e) {
      if (e.name === 'AbortError') return;
      if (e.name === 'NotAllowedError') {
        document.querySelector('.pv')?.remove();
        openSheet(`<div class="sheet-head"><h3>Fertig</h3><button class="btn small" data-close>Schließen</button></div><p class="hint">${esc(name)} ist erstellt.</p><button class="btn primary" id="shareNow">Teilen oder sichern</button>`, sh => {
          sh.querySelector('#shareNow').onclick = () => navigator.share({ files: [file], title: name }).then(() => { closeSheet(); onDone(); }).catch(() => {});
        });
        return;
      }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  onDone();
}
const csvQ = v => { const x = String(v ?? ''); return /[";\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; };

  const dk = ts.filter(t => t.type === 'dienstlich').reduce((a, t) => a + (t.km || 0), 0);

// L17 rows with the companion-training milestones in between
function l17Rows(y, vid) {

  let sum = 0, mark1 = !!st.d1, mark2 = !!st.d2;

    if (mark2 && t.start.t > st.d2) { out.push({ mark: `2. begleitende Schulung am ${fullDate(st.d2)}`, sum }); mark2 = false; }
    sum += t.km || 0;

async function openPreview(l17, name) {

    <div class="pv-pages"><p class="pv-wait">Vorschau wird erstellt…</p></div>`;
  document.body.appendChild(pv);
  const pages = pv.querySelector('.pv-pages');
  let big = false, blob = null;
  pv.querySelector('#pvClose').onclick = () => pv.remove();
  pv.querySelector('#pvZoom').onclick = () => { big = !big; pages.classList.toggle('big', big); pv.querySelector('#pvZoom').textContent = big ? 'Ganze Seite' : 'Vergrößern'; };

    </div>`, sheet => {

      const done = busy('Sicherung wird erstellt…');

      for (const t of S.trips) for (const w of ['start', 'end']) { if (!t.photos?.[w]) continue; const b = await store.getPhoto(`${t.id}:${w}`).catch(() => null); if (b) photos[`${t.id}:${w}`] = await toData(b); }

      });
    };

    </form>`, sheet => {
    const vlist = sheet.querySelector('#vlist');
    const readRows = () => vlist.querySelectorAll('.vrow').forEach((row, i) => { vs[i].name = row.querySelector('[data-f=name]').value.trim(); vs[i].plate = row.querySelector('[data-f=plate]').value.trim(); });
    const drawV = () => {
      vlist.innerHTML = vs.map((v, i) => {
        const used = S.trips.some(t => t.vehicleId === v.id) || S.active?.vehicleId === v.id;
        return `<div class="vrow"><label class="field"><span class="lbl">Bezeichnung</span><input data-f="name" id="v_name_${i}" value="${esc(v.name)}" placeholder="z.B. VW Golf"></label><label class="field"><span class="lbl">Kennzeichen</span><input data-f="plate" id="v_plate_${i}" value="${esc(v.plate)}" placeholder="W-12345X"></label><button type="button" class="btn small danger" data-del="${i}" ${used || vs.length < 2 ? 'disabled title="Fahrzeug hat bereits Fahrten"' : ''}>Entfernen</button></div>`;
      }).join('');
      vlist.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { readRows(); vs.splice(+b.dataset.del, 1); drawV(); });
    };
    drawV();
    sheet.querySelector('#vAdd').onclick = () => { readRows(); vs.push({ id: uid(), name: '', plate: '' }); drawV(); vlist.querySelector('.vrow:last-child input').focus(); };
    sheet.querySelector('#l_on').onchange = e => { sheet.querySelector('#l17fields').hidden = !e.target.checked; };
    if (focus) setTimeout(() => sheet.querySelector('#sec_' + focus)?.scrollIntoView({ block: 'start' }), 50);
    sheet.querySelector('#sf').onsubmit = async e => {
      e.preventDefault(); readRows();
      vs = vs.filter(v => v.name || v.plate || S.trips.some(t => t.vehicleId === v.id));
      if (!vs.length) vs = [{ id: uid(), name: 'Mein Auto', plate: '' }];
      vs.forEach(v => { if (!v.name) v.name = v.plate || 'Auto'; });
      const q = id => sheet.querySelector('#' + id);
      S.settings = { ...S.settings, name: q('s_name').value.trim(), vehicles: vs, vehicleId: vs.some(v => v.id === S.settings.vehicleId) ? S.settings.vehicleId : vs[0].id,
        rate: num(q('s_rate').value) ?? 0.5, defaultType: q('s_type').value, odoMode: q('s_odo').value, backupRemind: q('s_bk').value,
        mode: q('l_on').checked && !c.on ? 'l17' : S.settings.mode,
        l17: { on: q('l_on').checked, learner: q('l_learner').value.trim(), birth: q('l_birth').value, companions: q('l_comp').value.trim(), s1: q('l_s1').value, s2: q('l_s2').value } };
      await store.set('settings', S.settings); closeSheet(); render(); toast('Einstellungen gespeichert.');
    };
  });
}

/* ---------- updates: the home-screen app stays in memory, so look for a newer version whenever it comes back ---------- */
const APP_VERSION = '2026-10-20.15';
let swReg = null, lastCheck = 0;
async function checkForUpdate() {
  if (Date.now() - lastCheck < 60e3) return;
  lastCheck = Date.now();
  swReg?.update?.().catch(() => {});
  try {
    const r = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) applyUpdate(m[1]);
  } catch {}
}
function applyUpdate(v) {
  let tried = null; try { tried = sessionStorage.getItem('updTried'); } catch {}
  const reload = () => { try { sessionStorage.setItem('updTried', v); } catch {} saveActive().finally(() => location.reload()); };
  const idle = tried !== v && !$('#sheetRoot').innerHTML && !document.querySelector('.busy, .viewer') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (idle) { reload(); return; }
  if ($('.updbar')) return;
  const bar = document.createElement('div'); bar.className = 'updbar'; bar.setAttribute('role', 'status');
  bar.innerHTML = '<span>Neue Version verfügbar</span><button type="button">Jetzt laden</button>';
  bar.querySelector('button').onclick = reload;
  document.body.appendChild(bar);
}

/* ---------- boot ---------- */
(async function boot() {
  try {
    await store.open();
    S.trips = (await store.trips()) || [];
    S.settings = { ...S.settings, ...((await store.get('settings')) || {}) };
    S.active = (await store.get('active')) || null;
    // one vehicle from the old single "Fahrzeug" field
    if (!Array.isArray(S.settings.vehicles) || !S.settings.vehicles.length) {
      S.settings.vehicles = [{ id: 'v1', name: S.settings.vehicle || 'Mein Auto', plate: '' }];
      S.settings.vehicleId = 'v1';
      await store.set('settings', S.settings);
    }
    const v0 = S.settings.vehicles[0].id;
    for (const t of S.trips) if (!t.vehicleId) { t.vehicleId = v0; await store.putTrip(t); }
    if (S.active && !S.active.vehicleId) { S.active.vehicleId = v0; await saveActive(); }
  } catch (e) { toast('Speicher nicht verfügbar. Bitte nicht im privaten Modus öffnen.'); }
  $('#settingsBtn').onclick = () => openSettings();
  $('#exportBtn').onclick = openExport;
  $('#backupBtn').onclick = openBackup;
  render();
  if (S.active) { startWatch(); if (!S.active.start.addr) resolveStartAddr(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; }).catch(() => {});
  setTimeout(checkForUpdate, 3000);
  setInterval(() => { if (document.visibilityState === 'visible') checkForUpdate(); }, 30 * 60e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
})();
</script>
