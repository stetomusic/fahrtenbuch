<html lang="de">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: one column phone app; summary strip, big start/stop control, trip log grouped by month; sheets slide up from the bottom. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --ink: #15201b;
  --muted: #5b6a63;
  --line: #d6dedA;
  --accent: #0e6b50;
  --accent-ink: #ffffff;
  --run: #c2410c;
  --danger: #b42318;
  --soft: #e2ebe7;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #17201c; --ink: #e5ece8; --muted: #98a7a0; --line: #2a3632;
    --accent: #3cbf8e; --accent-ink: #06231a; --run: #f08a4b; --danger: #f2675c; --soft: #1f2b27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #17201c; --ink: #e5ece8; --muted: #98a7a0; --line: #2a3632;
  --accent: #3cbf8e; --accent-ink: #06231a; --run: #f08a4b; --danger: #f2675c; --soft: #1f2b27;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 2px; gap: 12px; }
header.top h1 { font: 700 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
header.top .sub { color: var(--muted); font-size: 14px; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; }

.summary { display: grid; grid-template-columns: auto 1fr 1fr; gap: 12px; align-items: center; }
.yearsw { display: flex; align-items: center; gap: 2px; font: 600 20px var(--font-display); }
.yearsw button { background: none; border: 0; width: 32px; height: 40px; font-size: 22px; color: var(--muted); }
.stat .lbl, .lbl { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .val { font: 600 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.warn { color: var(--danger); font-size: 13px; }

.control { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 14px; }
.big {
  width: 100%; min-height: 128px; border: 0; border-radius: 18px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  font: 700 30px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  transition: transform .08s ease;
}
.big:active { transform: scale(.98); }
.big:disabled { opacity: .7; }
.big.start { background: var(--accent); color: var(--accent-ink); }
.big.stop { background: var(--run); color: #fff; min-height: 96px; }
.big .ico { width: 44px; height: 44px; border-radius: 50%; border: 3px solid currentColor; display: grid; place-items: center; }
.big .ico svg { width: 18px; height: 18px; fill: currentColor; }
.odo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.odo { display: inline-flex; gap: 3px; }
.odo span { font: 500 18px/1 var(--font-mono); background: var(--ink); color: var(--surface); padding: 6px 5px; border-radius: 4px; min-width: 22px; text-align: center; }
.odo span.unit { background: none; color: var(--muted); font: 500 14px var(--font-body); padding: 6px 2px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }

.run-head { display: flex; align-items: center; gap: 10px; font: 600 22px var(--font-display); text-transform: uppercase; letter-spacing: .03em; color: var(--run); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--run); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .big { transition: none; } }
.run-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.run-grid .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.run-grid .full { grid-column: 1 / -1; min-width: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

.field { display: grid; gap: 4px; min-width: 0; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.field input, .field select { min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.field.err input { border-color: var(--danger); }
.field .msg { color: var(--danger); font-size: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2, .row3 { align-items: start; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 10px; min-height: 44px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.month h2 { font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; margin: 8px 2px 8px; }
.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.trip { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 14px; width: 100%; }
.trip:first-child { border-top: 0; }
.trip .d { font: 600 18px/1.1 var(--font-display); }
.trip .d small { display: block; font: 400 13px var(--font-body); color: var(--muted); }
.trip .r { min-width: 0; }
.trip .r b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip .r span { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip .k { text-align: right; font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.pill.draft { background: var(--run); color: #fff; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; color: var(--muted); text-align: center; }

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 48px; padding: 10px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 600px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-radius: 22px 22px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; overscroll-behavior: contain;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h3 { margin: 0; font: 700 22px var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.calc { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.calc .opt { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.map { height: 260px; border-radius: 14px; overflow: hidden; background: var(--soft); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.log { font-size: 13px; color: var(--muted); }
.log li { margin-bottom: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.confirm { background: var(--soft); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }

.odo-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.cam { width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.cam svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
.cam.has { border-color: var(--accent); background: var(--soft); }
.cam.has svg { stroke: var(--accent); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumb { display: grid; gap: 4px; background: none; border: 0; padding: 0; text-align: left; font-size: 12px; color: var(--muted); }
.thumb img { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.viewer { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.choice { display: grid; gap: 10px; }
.choice .btn { min-height: 64px; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.choice .btn svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.choice .link { justify-self: center; }
.updbar { position: fixed; left: 0; right: 0; top: 0; z-index: 85; background: var(--accent); color: var(--accent-ink); display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); font-weight: 600; }
.updbar button { background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.scanner { position: fixed; inset: 0; z-index: 95; background: #000; color: #fff; overflow: hidden; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; left: 8%; right: 8%; top: 39%; height: 11%; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.6); transition: border-color .2s; z-index: 1; }
.scan-frame.ok { border-color: #3cbf8e; }
.scan-top { position: absolute; z-index: 2; left: 0; right: 0; top: 0; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 0; display: grid; gap: 4px; text-align: center; }
.scan-top b { font: 700 24px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.scan-bottom { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.scan-read { text-align: center; font: 500 30px var(--font-mono); min-height: 40px; font-variant-numeric: tabular-nums; }
.scan-read.msg { font: 500 17px var(--font-body); }
.scan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scan-actions .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.3); }
.scan-actions .btn.primary { grid-column: 1 / -1; min-height: 58px; font-size: 19px; background: #3cbf8e; color: #06231a; border-color: #3cbf8e; }
.scan-actions .btn:disabled { opacity: .45; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 12px 16px; border-radius: 12px; z-index: 80; max-width: calc(100% - 32px); font-size: 15px; }
.busy { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.busy div { background: var(--surface); padding: 18px 22px; border-radius: 14px; font-weight: 600; }

#print { display: none; }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; font: 10pt/1.3 var(--font-body); color: #000; }
  #print table { width: 100%; border-collapse: collapse; }
  #print th, #print td { border: 1px solid #999; padding: 3px 4px; vertical-align: top; text-align: left; }
  #print td.n, #print th.n { text-align: right; font-variant-numeric: tabular-nums; }
  #print h1 { font-size: 16pt; margin: 0 0 4px; }
  @page { size: A4 landscape; margin: 12mm; }
}
@media (max-width: 380px) { .summary { grid-template-columns: 1fr 1fr; } .yearsw { grid-column: 1 / -1; } .row3 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Fahrtenbuch</h1>
      <div class="sub" id="vehicle"></div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="summary" id="summary"></section>
  <section class="control" id="control"></section>
  <section id="log"></section>
  <section class="tools">
    <button class="btn" id="exportBtn">Export &amp; PDF</button>
    <button class="btn" id="backupBtn">Sicherung</button>
  </section>
</div>
<div id="print"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const num = v => { if (v === null || v === undefined || v === '') return null; const x = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return Number.isFinite(x) ? x : null; };
const fmtKm = n => (n ?? 0).toLocaleString('de-AT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtEur = n => (n ?? 0).toLocaleString('de-AT', { style: 'currency', currency: 'EUR' });
const fmtInt = n => n == null ? '' : Math.round(n).toLocaleString('de-AT');
const dateVal = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const timeVal = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fromInputs = (date, time) => new Date(`${date}T${time || '00:00'}`).getTime();
const dayLabel = t => new Date(t).toLocaleDateString('de-AT', { weekday: 'short', day: '2-digit', month: '2-digit' });
const fullDate = t => new Date(t).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const round1 = x => Math.round(x * 10) / 10;
const KM_LIMIT = 30000;

function hav(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
function trackStats(tr) {
  let km = 0, gap = 0;
  for (let i = 1; i < tr.length; i++) { const d = hav(tr[i - 1], tr[i]); km += d; if (d > 1.5) gap += d; }
  return { km, gapShare: km ? gap / km : 1 };
}

/* ---------- storage (IndexedDB, stays on this phone) ---------- */
const store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('fahrtenbuch', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('trips')) d.createObjectStore('trips', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  run(name, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(name, mode);
      const out = fn(t.objectStore(name));
      t.oncomplete = () => res(out instanceof IDBRequest ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  trips() { return this.run('trips', 'readonly', s => s.getAll()); },
  putTrip(t) { return this.run('trips', 'readwrite', s => { s.put(t); }); },
  delTrip(id) { return this.run('trips', 'readwrite', s => { s.delete(id); }); },
  get(k) { return this.run('meta', 'readonly', s => s.get(k)); },
  set(k, v) { return this.run('meta', 'readwrite', s => { s.put(v, k); }); },
  getPhoto(k) { return this.run('photos', 'readonly', s => s.get(k)); },
  putPhoto(k, blob) { return this.run('photos', 'readwrite', s => { s.put(blob, k); }); },
  delPhotos(id) { return this.run('photos', 'readwrite', s => { s.delete(id + ':start'); s.delete(id + ':end'); }); },
};

/* ---------- KM-Stand photo + text recognition ---------- */
const CAM_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8h3.2l1.8-2.6h7l1.8 2.6h3.2v11h-17z"/><circle cx="12" cy="13.2" r="3.6"/></svg>';
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrPromise = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
function getOcr() {
  if (!ocrPromise) ocrPromise = (async () => {

/* ---------- online services (OpenStreetMap) ---------- */
async function fetchJSON(url, ms = 9000) {

  finally { clearTimeout(timer); }
}

  if (!p || p.lat == null) return '';

    const j = await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&zoom=18&addressdetails=1&lat=${p.lat}&lon=${p.lng}`);
    const a = j.address || {};
    const street = [a.road || a.pedestrian || a.footway || a.path || '', a.house_number || ''].join(' ').trim();
    const city = [a.postcode || '', a.city || a.town || a.village || a.municipality || ''].join(' ').trim();
    return [street, city].filter(Boolean).join(', ') || j.display_name || '';
  } catch { return ''; }
}
async function geocode(q) {
  try {
    const j = await fetchJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q=${encodeURIComponent(q)}`);
    return j[0] ? { lat: +j[0].lat, lng: +j[0].lon } : null;
  } catch { return null; }
}

  try {
    const j = await fetchJSON(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=simplified&geometries=geojson`, 12000);

  } catch { return null; }
}
function gmapsUrl(t) {
  const s = t.start || {}, e = t.end || {};
  if (s.lat == null || e.lat == null) {
    if (s.addr && e.addr) return `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${encodeURIComponent(s.addr)}&destination=${encodeURIComponent(e.addr)}`;
    return null;
  }
  let wp = '';
  const tr = t.track || [];
  if (tr.length > 4) {

    for (let i = 1; i <= n; i++) { const p = tr[Math.round(i * (tr.length - 1) / (n + 1))]; pts.push(p[0].toFixed(5) + ',' + p[1].toFixed(5)); }

  };

    const a = S.active; if (!a || a.id !== id) return;

}

function drawMap(el, t) {
  if (!window.L) { el.innerHTML = '<p class="hint" style="padding:12px">Karte nicht verfügbar (offline?).</p>'; return; }
  const css = getComputedStyle(document.documentElement);
  const map = L.map(el, { zoomControl: false, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const gps = t.track && t.track.length > 1 ? t.track.map(p => [p[0], p[1]]) : null;
  const layers = [];
  if (t.routeLine && t.routeLine.length > 1) layers.push(L.polyline(t.routeLine, { color: css.getPropertyValue('--muted').trim() || '#666', weight: 4, dashArray: '6 8', opacity: .8 }));
  if (gps) layers.push(L.polyline(gps, { color: css.getPropertyValue('--accent').trim() || '#0e6b50', weight: 5 }));
  const s = t.start, e = t.end;
  if (s?.lat != null) layers.push(L.circleMarker([s.lat, s.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#0e6b50', fillOpacity: 1 }).bindTooltip('Start'));
  if (e?.lat != null) layers.push(L.circleMarker([e.lat, e.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#c2410c', fillOpacity: 1 }).bindTooltip('Ziel'));
  const grp = L.featureGroup(layers).addTo(map);
  setTimeout(() => { map.invalidateSize(); try { map.fitBounds(grp.getBounds(), { padding: [24, 24] }); } catch { map.setView([47.6, 13.8], 7); } }, 50);
}

  }

    <p>${esc(S.settings.name || '')}${S.settings.vehicle ? ' · Fahrzeug: ' + esc(S.settings.vehicle) : ''} · Kilometergeld ${fmtEur(rate)}/km</p>
    <table><thead><tr><th>Datum</th><th>Zeit</th><th>Von</th><th>Nach</th><th>Zweck / Kunde</th><th>Art</th><th class="n">KM-Stand Beginn</th><th class="n">KM-Stand Ende</th><th class="n">km</th><th class="n">€</th><th>Foto</th></tr></thead><tbody>
    ${ts.map(t => `<tr><td>${fullDate(t.start.t)}</td><td>${timeVal(t.start.t)}–${t.end ? timeVal(t.end.t) : ''}</td><td>${esc(t.start.addr)}</td><td>${esc(t.end?.addr)}</td><td>${esc(t.purpose)}${t.client ? ' / ' + esc(t.client) : ''}${t.changes?.length ? ' *' : ''}</td><td>${t.type === 'privat' ? 'privat' : 'dienstl.'}</td><td class="n">${fmtInt(t.odoStart)}</td><td class="n">${fmtInt(t.odoEnd)}</td><td class="n">${fmtKm(t.km)}</td><td class="n">${t.type === 'dienstlich' ? fmtEur((t.km || 0) * rate) : ''}</td><td>${t.photos?.start && t.photos?.end ? '✓' : ''}</td></tr>`).join('')}
    <tr><td colspan="8"><b>Summe dienstlich</b></td><td class="n"><b>${fmtKm(dk)}</b></td><td class="n"><b>${fmtEur(Math.min(dk, KM_LIMIT) * rate)}</b></td><td></td></tr>
    </tbody></table>
    <p>* nachträglich geändert, Änderungen sind in der App je Fahrt protokolliert. Erstellt am ${new Date().toLocaleString('de-AT')}.</p>`;
}
function openExport() {
  const ys = yearsAvailable();
  openSheet(`
    <div class="sheet-head"><h3>Export</h3><button class="btn small" data-close>Schließen</button></div>
    <label class="field"><span class="lbl">Jahr</span><select id="x_year">${ys.map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
    <p class="hint" id="x_info"></p>
    <div class="actions">
      <button class="btn primary" id="x_csv">Excel-Tabelle (CSV)</button>
      <button class="btn" id="x_pdf">Druckansicht / PDF</button>
    </div>
    <p class="hint">Am iPhone: Druckansicht öffnen, dann im Druckmenü mit zwei Fingern auf die Vorschau aufziehen, um ein PDF zu teilen oder zu sichern.</p>`, sheet => {
    const sel = sheet.querySelector('#x_year');
    const info = () => { const y = +sel.value, ts = yearTrips(y), dk = ts.filter(t => t.type === 'dienstlich').reduce((s, t) => s + (t.km || 0), 0); sheet.querySelector('#x_info').textContent = `${ts.length} Fahrten, ${fmtKm(dk)} km dienstlich, Kilometergeld ${fmtEur(Math.min(dk, KM_LIMIT) * (S.settings.rate || 0))}.`; };
    sel.onchange = info; info();
    sheet.querySelector('#x_csv').onclick = () => deliverFile(`Fahrtenbuch_${sel.value}.csv`, new Blob([csvFor(+sel.value)], { type: 'text/csv;charset=utf-8' }));
    sheet.querySelector('#x_pdf').onclick = () => { buildPrint(+sel.value); window.print(); };
  });
}
function openBackup() {
  openSheet(`
    <div class="sheet-head"><h3>Sicherung</h3><button class="btn small" data-close>Schließen</button></div>
    <p class="hint">Deine Fahrten und Tacho-Fotos sind nur auf diesem Handy gespeichert. Speichere regelmäßig eine Sicherung, z.B. in iCloud Drive, damit nichts verloren geht.</p>
    <div class="actions">
      <button class="btn primary" id="b_save">Sicherung speichern</button>
      <label class="btn" style="display:grid;place-items:center">Sicherung laden<input type="file" id="b_load" accept=".json,application/json" hidden></label>
    </div>`, sheet => {
    sheet.querySelector('#b_save').onclick = async () => {
      const done = busy('Sicherung wird erstellt…');
      const photos = {};
      const toData = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
      for (const t of S.trips) for (const w of ['start', 'end']) { if (!t.photos?.[w]) continue; const b = await store.getPhoto(`${t.id}:${w}`).catch(() => null); if (b) photos[`${t.id}:${w}`] = await toData(b); }
      done();
      deliverFile(`Fahrtenbuch_Sicherung_${dateVal(Date.now())}.json`, new Blob([JSON.stringify({ app: 'fahrtenbuch', version: 2, exported: Date.now(), settings: S.settings, trips: S.trips, photos })], { type: 'application/json' }));
    };
    sheet.querySelector('#b_load').onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (data.app !== 'fahrtenbuch' || !Array.isArray(data.trips)) throw new Error('format');
        let added = 0, updated = 0;
        for (const t of data.trips) {
          const cur = S.trips.find(x => x.id === t.id);
          if (!cur) { S.trips.push(t); await store.putTrip(t); added++; }
          else if ((t.updated || 0) > (cur.updated || 0)) { Object.assign(cur, t); await store.putTrip(cur); updated++; }
        }
        for (const [k, u] of Object.entries(data.photos || {})) { if (!(await store.getPhoto(k).catch(() => null))) await store.putPhoto(k, await (await fetch(u)).blob()); }
        if (data.settings && !S.settings.name && !S.settings.vehicle) { S.settings = { ...S.settings, ...data.settings }; await store.set('settings', S.settings); }
        closeSheet(); render(); toast(`${added} Fahrten übernommen, ${updated} aktualisiert.`);
      } catch { toast('Diese Datei ist keine Fahrtenbuch-Sicherung.'); }
    };
  });
}
function openSettings() {
  const s = S.settings;
  openSheet(`
    <div class="sheet-head"><h3>Einstellungen</h3><button class="btn small" data-close>Schließen</button></div>
    <form id="sf" style="display:grid;gap:12px">
      <label class="field"><span class="lbl">Name</span><input id="s_name" value="${esc(s.name)}" autocomplete="name"></label>
      <label class="field"><span class="lbl">Fahrzeug / Kennzeichen</span><input id="s_vehicle" value="${esc(s.vehicle)}" placeholder="z.B. VW Golf, W-12345X"></label>
      <div class="row2">
        <label class="field"><span class="lbl">Kilometergeld € pro km</span><input id="s_rate" inputmode="decimal" value="${String(s.rate).replace('.', ',')}"></label>
        <label class="field"><span class="lbl">Standard-Fahrtart</span><select id="s_type"><option value="dienstlich" ${s.defaultType === 'dienstlich' ? 'selected' : ''}>Dienstlich</option><option value="privat" ${s.defaultType === 'privat' ? 'selected' : ''}>Privat</option></select></label>
      </div>
      <label class="field"><span class="lbl">KM-Stand bei Start und Ende</span><select id="s_odo">${[['ask', 'Jedes Mal fragen'], ['camera', 'Immer Tacho fotografieren'], ['manual', 'Immer selbst eintippen'], ['off', 'Nicht abfragen']].map(([k, l]) => `<option value="${k}" ${odoMode() === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <p class="hint">App-Version ${APP_VERSION}. Neue Versionen lädt die App automatisch.</p>
      <p class="hint">Amtliches Kilometergeld für PKW seit 2025: 0,50 € pro km, höchstens 30.000 km im Jahr. Fahrten zwischen Wohnung und Arbeitsplatz gehören nicht ins Fahrtenbuch, dafür gibt es die Pendlerpauschale.</p>
      <button class="btn primary" type="submit">Speichern</button>
    </form>`, sheet => {
    sheet.querySelector('#sf').onsubmit = async e => {
      e.preventDefault();
      S.settings = { name: sheet.querySelector('#s_name').value.trim(), vehicle: sheet.querySelector('#s_vehicle').value.trim(), rate: num(sheet.querySelector('#s_rate').value) ?? 0.5, defaultType: sheet.querySelector('#s_type').value, odoMode: sheet.querySelector('#s_odo').value };
      await store.set('settings', S.settings); closeSheet(); render(); toast('Einstellungen gespeichert.');
    };
  });
}

/* ---------- updates: the home-screen app stays in memory, so look for a newer version whenever it comes back ---------- */
const APP_VERSION = '2026-10-20.6';
let swReg = null, lastCheck = 0;
async function checkForUpdate() {
  if (Date.now() - lastCheck < 60e3) return;
  lastCheck = Date.now();
  swReg?.update?.().catch(() => {});
  try {
    const r = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) applyUpdate(m[1]);
  } catch {}
}
function applyUpdate(v) {
  let tried = null; try { tried = sessionStorage.getItem('updTried'); } catch {}
  const reload = () => { try { sessionStorage.setItem('updTried', v); } catch {} saveActive().finally(() => location.reload()); };
  const idle = tried !== v && !$('#sheetRoot').innerHTML && !document.querySelector('.busy, .viewer') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (idle) { reload(); return; }
  if ($('.updbar')) return;
  const bar = document.createElement('div'); bar.className = 'updbar'; bar.setAttribute('role', 'status');
  bar.innerHTML = '<span>Neue Version verfügbar</span><button type="button">Jetzt laden</button>';
  bar.querySelector('button').onclick = reload;
  document.body.appendChild(bar);
}

/* ---------- boot ---------- */
(async function boot() {
  try {
    await store.open();
    S.trips = (await store.trips()) || [];
    S.settings = { ...S.settings, ...((await store.get('settings')) || {}) };
    S.active = (await store.get('active')) || null;
  } catch (e) { toast('Speicher nicht verfügbar. Bitte nicht im privaten Modus öffnen.'); }
  $('#settingsBtn').onclick = openSettings;
  $('#exportBtn').onclick = openExport;
  $('#backupBtn').onclick = openBackup;
  render();
  if (S.active) { startWatch(); if (!S.active.start.addr) resolveStartAddr(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; }).catch(() => {});
  setTimeout(checkForUpdate, 3000);
  setInterval(() => { if (document.visibilityState === 'visible') checkForUpdate(); }, 30 * 60e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
})();
</script>
